services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env — see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      # mssql-tools18 (not mssql-tools) ships in the 2022 image; -C trusts the server's
      # self-signed cert, which sqlcmd otherwise refuses to connect through by default.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/src/OtoParcam.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Applies pending EF Core migrations at startup (see Program.cs) — only set here, so the
      # LocalDB dev workflow in CLAUDE.md (manual `dotnet ef database update`) is unaffected.
      AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: "Server=db;Database=OtoParcamDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      Jwt__Issuer: OtoParcam
      Jwt__Audience: OtoParcamClients
      Jwt__ExpiryMinutes: "60"
      App__FrontendBaseUrl: http://localhost:5173
      # Email sending is optional — SmtpEmailSender no-ops with a logged warning if Host/FromAddress
      # are blank (see CLAUDE.md's Email section), so these can stay unset for a first run.
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: OtoParcam
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Smtp__UseStartTls: "true"
      Email__Smtp__User: ${EMAIL_SMTP_USER:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
    ports:
      - "5284:8080"
    volumes:
      - uploads-data:/app/wwwroot/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the JS bundle at build time — see frontend/Dockerfile's comment. Change this
        # (and rebuild) if the backend isn't reachable at localhost:5284 from wherever the browser
        # opening this frontend actually runs (e.g. a LAN IP, per project_real_email memory notes).
        VITE_API_BASE_URL: http://localhost:5284/api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
  uploads-data:
