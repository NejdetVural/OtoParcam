# react-router's data router (see src/router.tsx) uses real client-side paths like /urunler/:id —
# a direct load or refresh on one of those must still get index.html (React Router then renders
# the right route client-side), not nginx's default 404 for a path with no matching file.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
